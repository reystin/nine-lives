name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in the fields below — without the mod build and logs it is hard to reproduce the issue.
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: "26.3"
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Fabric Loader version
      placeholder: "0.20.1"
    validations:
      required: true
  - type: input
    id: fabric-api
    attributes:
      label: Fabric API version
      placeholder: "0.165.0+26.3"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which Nine Lives build?
      options:
        - Full (client + server)
        - Server-only
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options:
        - Singleplayer
        - Multiplayer server
        - Both
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Advancement mode
      options:
        - Vanilla
        - Blaze and Caves (BACAP)
        - Not selected yet
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Latest log or crash report
      description: Paste a link (mclo.gs / pastebin) or attach `latest.log` / `crash-report`.
      render: text
  - type: input
    id: config
    attributes:
      label: Config changes
      description: Only if you changed config/ninelives.json or ninelives-client.json
      placeholder: "defaultMode=bc, respawnProtectionSeconds=20"
